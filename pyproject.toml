[project]
name = "chat-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "eakbaritabar@msmmed.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv>=4.0.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "langsmith>=0.13.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
chat-model = "chat_model:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
